<div class="filters">
  <!-- Is Active Filter -->
  <mat-form-field appearance="outline">
    <mat-label>Is Active</mat-label>
    <mat-select (selectionChange)="applyFilters()" [(value)]="isActiveFilter">
      <mat-option value="">All</mat-option>
      <mat-option value="1">Yes</mat-option>
      <mat-option value="0">No</mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Name Filter -->
  <mat-form-field appearance="outline">
    <mat-label>Name</mat-label>
    <mat-select (selectionChange)="applyFilters()" [(value)]="nameFilter">
      <mat-option value="">All</mat-option>
      <mat-option *ngFor="let name of uniqueNames" [value]="name">
        {{ name }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <button mat-stroked-button color="primary" (click)="clearFilters()">
    Clear
  </button>
</div>

<table mat-table [dataSource]="dataSource" class="table-container mat-elevation-z8">

  <!-- Select Checkbox Column -->
  <ng-container matColumnDef="select">
    <th mat-header-cell *matHeaderCellDef>Select</th>
    <td mat-cell *matCellDef="let row">
      <mat-checkbox (click)="$event.stopPropagation()" (change)="toggleRow(row)" [checked]="isSelected(row)">
      </mat-checkbox>
    </td>
  </ng-container>

  <!-- ID Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let element">
      {{ element.id }}
    </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let element">
      {{ element.name }}
    </td>
  </ng-container>

  <!-- Is Active Column -->
  <ng-container matColumnDef="isActive">
    <th mat-header-cell *matHeaderCellDef>Is Active</th>
    <td mat-cell *matCellDef="let element">
      {{ element.isActive === 1 ? 'Yes' : 'No' }}
    </td>
  </ng-container>

  <!-- Status Column -->
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let element">
      {{ element.status }}
    </td>
  </ng-container>

  <!-- Rows -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="toggleRow(row)">
  </tr>

</table>
<div>{{dataSource.filteredData | json}}</div>
